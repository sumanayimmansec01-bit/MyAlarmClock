name: Android APK

on:
  push:
    branches: [ccr-8e469141-uk5ajj]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MyAlarmClock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyAlarmClock-apk
          path: MyAlarmClock.apk

      - name: Publish as the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MyAlarmClock.apk \
            --target "${{ github.sha }}" \
            --title "แอพ Android ล่าสุด (build ${{ github.run_number }})" \
            --notes "ดาวน์โหลด MyAlarmClock.apk ด้านล่าง แล้วเปิดไฟล์ในมือถือ Android เพื่อติดตั้ง"
