<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="จับเวลา">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}</style>
<title>นาฬิกาจับเวลาหลายรอบ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap">
<style>
  /* Layout D: one calm screen — a thin ring, a strip of rounds sized by length,
     and one round start button. Settings and round edits open as bottom sheets. */
  :root {
    --bg: #f7f8f6;
    --card: #ffffff;
    --ink: #1f2a28;
    --soft: #6f7b78;
    --hair: #e1e6e3;
    --sage: #3f8f7f;
    --sage-soft: #e3f1ed;
    --on-sage: #ffffff;
    --pause: #c9772a;
    --resume: #3d78a8;
    --danger: #c0533f;
    --font: "Prompt", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121816; --card: #1a2220; --ink: #e8eeec; --soft: #94a29e; --hair: #28322f;
      --sage: #6cc3b0; --sage-soft: #1d3530; --on-sage: #0d1a17;
      --pause: #f0aa5c; --resume: #7fb4e0; --danger: #f08a78;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121816; --card: #1a2220; --ink: #e8eeec; --soft: #94a29e; --hair: #28322f;
    --sage: #6cc3b0; --sage-soft: #1d3530; --on-sage: #0d1a17;
    --pause: #f0aa5c; --resume: #7fb4e0; --danger: #f08a78;
    color-scheme: dark;
  }

  html { height: 100%; box-sizing: border-box; }
  body {
    box-sizing: border-box; height: 100%; overflow: hidden; margin: 0;
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 16px; line-height: 1.45;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
    padding-block: 14px 18px;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; }
  .app { max-width: 420px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }

  header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: .95rem; font-weight: 400; color: var(--soft); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--hair); background: var(--card);
    display: grid; place-items: center; font-size: 1.05rem; cursor: pointer; color: var(--soft);
  }

  /* Ring */
  .dial { position: relative; width: min(76vw, 300px, 38dvh); aspect-ratio: 1; max-width: 100%; margin-top: auto; flex: none; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .dial circle { fill: none; stroke-width: 4.5; }
  .dial .track { stroke: var(--hair); }
  .dial .prog { stroke: var(--sage); stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
  .dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; padding: 0 12%; }
  .round-label, .end-at { font-size: .82rem; color: var(--soft); }
  .end-at { min-height: 1.2em; }
  .time { font-weight: 300; font-size: clamp(2.8rem, 14vw, 3.8rem); line-height: 1.05; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .dial.finished .round-label { color: var(--sage); font-weight: 500; }

  .wake { margin-top: 10px; font-size: .78rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--hair); background: var(--card); color: var(--soft); cursor: default; }
  .wake[data-state="denied"], .wake[data-state="unsupported"] { color: var(--pause); border-color: var(--pause); }
  .wake[data-state="denied"] { cursor: pointer; }

  /* Round strip: one segment per round, as wide as its share of the time */
  .rounds-wrap { width: 100%; margin-top: max(14px, 3dvh); display: flex; flex-direction: column; gap: 8px; }
  .rounds-head { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--soft); font-variant-numeric: tabular-nums; }
  .strip { display: flex; gap: 6px; align-items: flex-start; }
  .seg {
    flex: var(--w) 1 0; min-width: 22px; padding: 4px 0 0; border: 0; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .seg:disabled { cursor: default; }
  .seg .bar { width: 100%; height: 10px; border-radius: 5px; background: var(--hair); overflow: hidden; }
  .seg .bar i { display: block; height: 100%; width: var(--p, 0%); background: var(--sage); border-radius: 5px; }
  .seg .min { font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%; }
  .seg.done .min { color: var(--soft); }
  .seg.current .min { color: var(--sage); font-weight: 500; }
  .seg.add { flex: 0 0 36px; color: var(--sage); }
  .seg.add .bar { background: none; border: 1.5px dashed var(--hair); box-sizing: border-box; }
  .seg.add .min { font-size: 1.05rem; line-height: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .empty-hint { font-size: .85rem; color: var(--soft); align-self: center; }

  /* Start */
  .controls { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .start { border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .start .go {
    width: 76px; height: 76px; border-radius: 50%; background: var(--sage); color: var(--on-sage);
    display: grid; place-items: center; font-size: 1.5rem; line-height: 1;
    box-shadow: 0 8px 22px color-mix(in srgb, var(--sage) 30%, transparent);
  }
  .start .go::before { content: "▶"; margin-left: 4px; }
  .start[data-action="pause"] .go { background: var(--pause); box-shadow: 0 8px 22px color-mix(in srgb, var(--pause) 30%, transparent); }
  .start[data-action="pause"] .go::before { content: "❚❚"; margin: 0; letter-spacing: -3px; font-size: 1.2rem; }
  .start[data-action="resume"] .go { background: var(--resume); box-shadow: 0 8px 22px color-mix(in srgb, var(--resume) 30%, transparent); }
  .start[data-action="skip"] .go::before { content: "⏭"; margin: 0; }
  .start .label { font-size: .9rem; color: var(--soft); }
  .start:disabled { opacity: .4; cursor: default; }
  .start:disabled .go { box-shadow: none; }
  .reset { border: 0; background: none; color: var(--soft); font-size: .82rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 8px; }
  .reset:disabled { visibility: hidden; }

  /* Bottom sheets */
  dialog.sheet {
    width: 100%; max-width: 460px; max-height: 88dvh; margin: auto auto 0; padding: 0;
    border: 0; border-radius: 24px 24px 0 0; background: var(--card); color: var(--ink);
    display: flex; flex-direction: column;
  }
  dialog.sheet:not([open]) { display: none; }
  dialog.sheet::backdrop { background: rgb(0 0 0 / .35); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 8px; }
  .sheet-head h2 { margin: 0; font-size: 1.05rem; font-weight: 500; }
  .text-btn { border: 0; background: none; color: var(--sage); font-weight: 500; padding: 6px 4px; cursor: pointer; }
  .sheet-body {
    overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  }
  .group { margin: 10px 0 0; font-size: .78rem; font-weight: 500; letter-spacing: .06em; color: var(--soft); }
  .sub { margin: 2px 0 -4px; font-size: .9rem; font-weight: 500; }

  .stepper { display: flex; align-items: center; justify-content: center; gap: 20px; }
  .stepper output { font-size: 2.4rem; font-weight: 300; min-width: 150px; text-align: center; font-variant-numeric: tabular-nums; }
  .step { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--hair); background: var(--bg); color: var(--sage); font-size: 1.4rem; cursor: pointer; }
  .step:disabled { opacity: .35; cursor: default; }
  .quick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .quick button { border: 1px solid transparent; border-radius: 12px; background: var(--bg); padding: 8px 0; cursor: pointer; font-variant-numeric: tabular-nums; }
  .quick button[aria-pressed="true"] { background: var(--sage-soft); color: var(--sage); border-color: var(--sage); font-weight: 500; }
  .type-row input {
    width: 100%; box-sizing: border-box; font: inherit; font-size: .95rem; padding: 10px 14px; border-radius: 12px;
    border: 1px solid var(--hair); background: var(--bg); color: var(--ink);
  }
  .error { color: var(--danger); font-size: .85rem; margin: 0; }
  .sheet-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 4px; }
  .sheet-actions .left { display: flex; gap: 14px; }
  .danger-link { border: 0; background: none; color: var(--danger); font-size: .88rem; padding: 6px 0; cursor: pointer; }
  .pill-btn { border: 0; border-radius: 999px; background: var(--sage); color: var(--on-sage); padding: 10px 26px; font-weight: 500; cursor: pointer; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choices.four { grid-template-columns: repeat(4, 1fr); }
  .choices.three { grid-template-columns: repeat(3, 1fr); }
  .choice {
    border: 1px solid var(--hair); border-radius: 14px; background: var(--bg); padding: 10px 12px; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 8px; font-size: .92rem;
  }
  .choice::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--hair); flex: none; }
  .choice[aria-checked="true"] { border-color: var(--sage); background: var(--sage-soft); }
  .choice[aria-checked="true"]::before { border-color: var(--sage); background: var(--sage); box-shadow: inset 0 0 0 2px var(--sage-soft); }
  .choice.wide { grid-column: 1 / -1; }
  .choices.four .choice, .choices.three .choice { justify-content: center; padding: 9px 4px; }
  .choices.four .choice::before, .choices.three .choice::before { display: none; }
  .soft-btn { border: 1px solid var(--hair); border-radius: 14px; background: var(--bg); padding: 11px; cursor: pointer; font-weight: 500; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .toggle span { display: flex; flex-direction: column; }
  .toggle small { font-size: .8rem; color: var(--soft); }
  .toggle input { width: 44px; height: 24px; accent-color: var(--sage); flex: none; }
  .note { font-size: .8rem; color: var(--soft); margin: 6px 0 0; }

  /* Dim screen: deliberately black in both themes, with a faint clock. */
  .dim {
    position: fixed; inset: 0; z-index: 50; background: #000; color: #4b5552;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
    cursor: pointer; user-select: none;
  }
  .dim-time { font-size: 3rem; font-weight: 300; font-variant-numeric: tabular-nums; }
  .dim-label { font-size: .9rem; }
  .dim-hint { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); font-size: .8rem; color: #2c3331; }
  .dim-hint.warn { color: #8a5a1c; }

  @media (prefers-reduced-motion: reduce) { .dial .prog { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>จับเวลาหลายรอบ</h1>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="ตั้งค่า">⚙</button>
  </header>

  <div class="dial" id="dial">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="55"></circle>
      <circle class="prog" id="prog" cx="60" cy="60" r="55" stroke-dasharray="345.58" stroke-dashoffset="345.58"></circle>
    </svg>
    <div class="dial-center">
      <div class="round-label" id="roundLabel">พร้อมเริ่ม</div>
      <div class="time" id="time" role="timer" aria-live="off">30:00</div>
      <div class="end-at" id="endAt"></div>
    </div>
  </div>

  <button class="wake" id="wake" type="button" hidden></button>

  <section class="rounds-wrap" aria-label="รอบที่ตั้งไว้">
    <div class="rounds-head"><span id="total"></span><span id="finishAt"></span></div>
    <div class="strip" id="strip"></div>
  </section>

  <div class="controls">
    <button class="start" id="startBtn" type="button"><span class="go" aria-hidden="true"></span><span class="label" id="startLabel">เริ่ม</span></button>
    <button class="reset" id="resetBtn" type="button">เลิก แล้วเริ่มใหม่</button>
  </div>
</div>

<dialog class="sheet" id="roundSheet" aria-labelledby="roundTitle">
  <div class="sheet-head">
    <h2 id="roundTitle">รอบที่ 1</h2>
    <button class="text-btn" type="button" id="roundCancel">ยกเลิก</button>
  </div>
  <form class="sheet-body" id="roundForm" autocomplete="off">
    <div class="stepper">
      <button class="step" type="button" id="stepDown" aria-label="ลด 5 นาที">−</button>
      <output id="draft">40 นาที</output>
      <button class="step" type="button" id="stepUp" aria-label="เพิ่ม 5 นาที">+</button>
    </div>
    <div class="quick" id="quick"></div>
    <div class="type-row">
      <input id="roundInput" inputmode="text" placeholder="หรือพิมพ์ เช่น 25 หรือ 1:30 หรือ 30, 30" aria-label="พิมพ์เวลาเอง">
    </div>
    <p class="error" id="roundError" hidden></p>
    <div class="sheet-actions">
      <div class="left">
        <button class="danger-link" type="button" id="deleteRound">ลบรอบนี้</button>
        <button class="danger-link" type="button" id="clearBtn">ลบทุกรอบ</button>
      </div>
      <button class="pill-btn" type="submit" id="saveRound">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="settingsSheet" aria-labelledby="settingsTitle">
  <div class="sheet-head">
    <h2 id="settingsTitle">ตั้งค่า</h2>
    <button class="text-btn" type="button" data-close>เสร็จ</button>
  </div>
  <div class="sheet-body">
    <h3 class="group">เสียงเตือน • แตะเพื่อฟัง</h3>
    <h3 class="sub" id="soundsLabel">จบแต่ละรอบ</h3>
    <div class="choices" id="sounds" role="radiogroup" aria-labelledby="soundsLabel"></div>
    <h3 class="sub" id="finalLabel">จบรอบสุดท้าย</h3>
    <div class="choices" id="finalSounds" role="radiogroup" aria-labelledby="finalLabel"></div>
    <h3 class="sub" id="volumeLabel">ความดัง</h3>
    <div class="choices three" id="volumes" role="radiogroup" aria-labelledby="volumeLabel"></div>
    <button class="soft-btn" id="testSound" type="button">🔔 ทดสอบเสียง</button>

    <h3 class="group">ระหว่างนั่ง</h3>
    <h3 class="sub" id="prepLabel">นับถอยหลังก่อนเริ่มรอบแรก</h3>
    <div class="choices four" id="preps" role="radiogroup" aria-labelledby="prepLabel"></div>
    <label class="toggle" for="dimToggle">
      <span>จอมืดระหว่างจับเวลา<small>เหลือแค่เวลาตัวจาง แตะจอเพื่อแสดงปุ่ม</small></span>
      <input type="checkbox" id="dimToggle" role="switch">
    </label>

    <p class="note">ระหว่างจับเวลา เปิดหน้านี้ค้างไว้และเปิดเสียงสื่อของมือถือไว้ แอพจะกันจอดับให้</p>
  </div>
</dialog>

<div class="dim" id="dim" hidden>
  <div class="dim-label" id="dimLabel"></div>
  <div class="dim-time" id="dimTime"></div>
  <div class="dim-hint" id="dimHint">แตะจอเพื่อแสดงปุ่ม</div>
</div>

<script>
(() => {
  const STORE_KEY = "multi-round-timer:v1";
  const $ = (id) => document.getElementById(id);
  const els = {
    dial: $("dial"), prog: $("prog"), roundLabel: $("roundLabel"), time: $("time"), endAt: $("endAt"),
    startBtn: $("startBtn"), startLabel: $("startLabel"), resetBtn: $("resetBtn"),
    total: $("total"), finishAt: $("finishAt"), strip: $("strip"),
    testSound: $("testSound"), sounds: $("sounds"), wake: $("wake"),
    finalSounds: $("finalSounds"), preps: $("preps"), dimToggle: $("dimToggle"),
    dim: $("dim"), dimTime: $("dimTime"), dimLabel: $("dimLabel"), dimHint: $("dimHint"),
    settingsBtn: $("settingsBtn"), settingsSheet: $("settingsSheet"), volumes: $("volumes"),
    roundSheet: $("roundSheet"), roundTitle: $("roundTitle"), roundForm: $("roundForm"), roundCancel: $("roundCancel"),
    draft: $("draft"), stepDown: $("stepDown"), stepUp: $("stepUp"), quick: $("quick"),
    roundInput: $("roundInput"), roundError: $("roundError"), deleteRound: $("deleteRound"),
    clearBtn: $("clearBtn"), saveRound: $("saveRound"),
  };
  const CIRC = 2 * Math.PI * 55;
  els.prog.style.strokeDasharray = CIRC;

  // rounds are stored in seconds
  let rounds = [30 * 60, 30 * 60];
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (Array.isArray(saved) && saved.every((n) => Number.isFinite(n) && n > 0)) rounds = saved;
  } catch (_) {}
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(rounds)); } catch (_) {} };

  // state: idle | prep (settling-in countdown) | running | paused | finished
  let state = "idle";
  let idx = 0;          // current round index
  let endAt = 0;        // ms timestamp when the countdown (prep) or current round (running) ends
  let remainingMs = 0;  // remaining when paused
  let timerId = null;
  const active = () => state === "running" || state === "prep";

  // ---------- sound ----------
  let ctx = null;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  // Each alert is a single strike of the chosen sound.
  const SOUNDS = {
    rise:  { label: "ขันค่อยๆ ดัง (นุ่มที่สุด)", wide: true },
    bowl:  { label: "ขันทิเบต (นุ่ม)" },
    wood:  { label: "ไม้เคาะ (นุ่ม)" },
    chime: { label: "กริ๊ง 2 โน้ต" },
    beep:  { label: "บี๊บดิจิทัล" },
  };
  const PREPS = [0, 10, 20, 30];
  const VOLUMES = { soft: ["เบา", 0.35], medium: ["กลาง", 0.65], loud: ["ดัง", 1] };
  let soundKey = "rise";
  try { const k = localStorage.getItem(STORE_KEY + ":sound"); if (k && SOUNDS[k]) soundKey = k; } catch (_) {}

  const SETTINGS_KEY = STORE_KEY + ":settings";
  const settings = { finalSound: "same", volume: "medium", prep: 10, dim: true };
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    if (saved.finalSound === "same" || SOUNDS[saved.finalSound]) settings.finalSound = saved.finalSound;
    if (PREPS.includes(saved.prep)) settings.prep = saved.prep;
    if (VOLUMES[saved.volume]) settings.volume = saved.volume;
    if (typeof saved.dim === "boolean") settings.dim = saved.dim;
  } catch (_) {}
  const saveSettings = () => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (_) {} };
  const finalKey = () => (settings.finalSound === "same" ? soundKey : settings.finalSound);

  function tone(ac, out, freq, start, peak, decay, attack, type = "sine") {
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(peak, start + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, start + decay);
    osc.connect(g).connect(out);
    osc.start(start);
    osc.stop(start + decay + 0.05);
  }

  // Fades in from silence over [rise] s, holds, then fades out over [fade] s.
  function swell(ac, out, freq, start, peak, rise, hold, fade) {
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(peak, start + rise);
    g.gain.setValueAtTime(peak, start + rise + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, start + rise + hold + fade);
    osc.connect(g).connect(out);
    osc.start(start);
    osc.stop(start + rise + hold + fade + 0.05);
  }

  let currentOut = null;
  function chime(key = soundKey) {
    const ac = audio();
    if (ac) {
      const t0 = ac.currentTime + 0.05;
      if (currentOut) currentOut.gain.setTargetAtTime(0, ac.currentTime, 0.05); // cut off a previous alert
      const out = ac.createGain();
      const master = ac.createGain();
      master.gain.value = VOLUMES[settings.volume][1];
      out.connect(master).connect(ac.destination);
      currentOut = out;
      if (key === "rise") {
        // A rubbed singing bowl: no strike at all. It grows out of silence over
        // 3 s so it never startles, rests, then fades away over about 5 s.
        out.gain.value = 0.5;
        [[1, 1], [2.71, 0.3], [5.12, 0.08]].forEach(([ratio, amp]) => {
          swell(ac, out, 220 * ratio, t0, amp, 3, 1.5, 5);
          swell(ac, out, 220 * ratio + 0.8, t0, amp * 0.6, 3, 1.5, 5); // slow shimmer
        });
      } else if (key === "bowl") {
        // Singing bowl: soft attack, inharmonic partials, a slow beat from a detuned twin.
        // It rings out for about 4 seconds.
        const partials = [[1, 1], [2.71, 0.45], [5.12, 0.2], [8.3, 0.08]];
        out.gain.value = 0.36;
        const decay = 8.6;
        partials.forEach(([ratio, amp]) => {
          tone(ac, out, 262 * ratio, t0, amp, decay / ratio ** 0.3, 0.06);
          tone(ac, out, 262 * ratio + 1.3, t0, amp * 0.6, decay / ratio ** 0.3, 0.06);
        });
      } else if (key === "wood") {
        // Wooden block: two soft knocks.
        [0, 0.25].forEach((off) => {
          tone(ac, out, 740, t0 + off, 0.7, 0.2, 0.003);
          tone(ac, out, 1480, t0 + off, 0.15, 0.08, 0.003);
        });
      } else if (key === "beep") {
        [0, 0.18, 0.36].forEach((off) => tone(ac, out, 1760, t0 + off, 0.35, 0.12, 0.005, "square"));
      } else {
        tone(ac, out, 880, t0, 0.9, 1.2, 0.02);
        tone(ac, out, 1318.5, t0 + 0.28, 0.9, 1.2, 0.02);
      }
    }
    try { navigator.vibrate && navigator.vibrate([400, 150, 400]); } catch (_) {}
  }

  // ---------- wake lock ----------
  // wakeState: "off" (not needed), "on", "denied" (phone refused) or "unsupported"
  let wakeLock = null;
  let wakeState = "off";
  async function lockScreen() {
    if (!("wakeLock" in navigator)) { wakeState = "unsupported"; renderWake(); return; }
    if (wakeLock) return;
    try {
      const lock = await navigator.wakeLock.request("screen");
      if (!active()) { lock.release(); return; }
      wakeLock = lock;
      wakeState = "on";
      lock.addEventListener("release", () => {
        if (wakeLock !== lock) return; // released on purpose
        wakeLock = null;
        // The phone dropped the lock (e.g. battery saver); ask again while the page is in front.
        if (active() && document.visibilityState === "visible") lockScreen();
        else { wakeState = active() ? "denied" : "off"; renderWake(); }
      });
    } catch (_) {
      wakeLock = null;
      wakeState = "denied";
    }
    renderWake();
  }
  function unlockScreen() {
    const lock = wakeLock;
    wakeLock = null;
    wakeState = "off";
    try { lock && lock.release(); } catch (_) {}
    renderWake();
  }
  function renderWake() {
    const el = els.wake;
    el.hidden = !active() || wakeState === "off";
    el.dataset.state = wakeState;
    el.textContent = wakeState === "on"
      ? "🔆 กันจอดับอยู่ วางมือถือไว้ได้เลย"
      : wakeState === "unsupported"
        ? "⚠️ เบราว์เซอร์นี้กันจอดับไม่ได้ ตั้งเวลาปิดหน้าจอของมือถือให้นานกว่ารอบ"
        : "⚠️ มือถือไม่อนุญาตให้กันจอดับ แตะเพื่อลองอีกครั้ง";
    // The dim screen hides the pill, so it repeats a warning in its hint line.
    els.dimHint.textContent = wakeState === "denied" || wakeState === "unsupported"
      ? "⚠️ จออาจดับเอง แตะเพื่อดูรายละเอียด" : "แตะจอเพื่อแสดงปุ่ม";
    els.dimHint.classList.toggle("warn", wakeState === "denied" || wakeState === "unsupported");
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (active()) { lockScreen(); tick(); }
    }
  });

  // ---------- format ----------
  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }
  function fmtRound(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return s ? `${m}:${String(s).padStart(2, "0")} นาที` : `${m} นาที`;
  }
  function clock(ms) {
    return new Date(ms).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) + " น.";
  }
  function parseEntry(str) {
    str = str.trim();
    if (!str) return null;
    let m;
    if ((m = str.match(/^(\d{1,3}):(\d{1,2})$/))) {
      const v = +m[1] * 60 + +m[2];
      return +m[2] < 60 && v > 0 ? v : NaN;
    }
    if (/^\d+(\.\d+)?$/.test(str)) {
      const v = Math.round(parseFloat(str) * 60);
      return v > 0 && v <= 24 * 3600 ? v : NaN;
    }
    return NaN;
  }

  // Rounds can be edited before starting and after the last round has finished.
  const canEdit = () => state === "idle" || state === "finished";
  function editRounds(change) {
    if (!canEdit()) return;
    change();
    if (state === "finished") { state = "idle"; idx = 0; }
    save();
    renderAll();
  }

  // ---------- render ----------
  // The strip: one segment per round, sized by its length. Before starting a
  // segment opens the round editor; while timing it fills up as time passes.
  function renderList() {
    els.strip.innerHTML = "";
    const editable = canEdit();
    rounds.forEach((sec, i) => {
      const seg = document.createElement("button");
      seg.type = "button";
      seg.className = "seg";
      seg.style.setProperty("--w", sec);
      const m = Math.floor(sec / 60), r = sec % 60;
      seg.innerHTML = `<span class="bar"><i></i></span><span class="min">${r ? `${m}:${String(r).padStart(2, "0")}` : m}<span class="sr"> นาที</span></span>`;
      seg.setAttribute("aria-label", `รอบ ${i + 1}: ${fmtRound(sec)}${editable ? " แตะเพื่อแก้" : ""}`);
      if (state !== "idle") {
        if (i < idx || state === "finished") seg.classList.add("done");
        else if (i === idx) seg.classList.add("current");
      }
      seg.disabled = !editable;
      seg.onclick = () => openEditor(i);
      els.strip.appendChild(seg);
    });
    if (editable) {
      const add = document.createElement("button");
      add.type = "button";
      add.className = "seg add";
      add.id = "addRound";
      add.setAttribute("aria-label", "เพิ่มรอบ");
      add.innerHTML = `<span class="bar"></span><span class="min">＋</span>`;
      add.onclick = () => openEditor(null);
      els.strip.appendChild(add);
    }
    if (!rounds.length) {
      const hint = document.createElement("span");
      hint.className = "empty-hint";
      hint.textContent = "แตะ ＋ เพื่อเพิ่มรอบแรก";
      els.strip.prepend(hint);
    }
    const sum = rounds.reduce((a, b) => a + b, 0);
    els.total.textContent = rounds.length ? `${rounds.length} รอบ • รวม ${fmt(sum)}` : "ยังไม่มีรอบ";
    renderProgress();
  }

  // Fill each segment and update the line above the strip.
  function renderProgress() {
    const segs = els.strip.querySelectorAll(".seg:not(.add)");
    const now = Date.now();
    segs.forEach((seg, i) => {
      let p = 0;
      if (state === "finished" || (state !== "idle" && state !== "prep" && i < idx)) p = 100;
      else if (i === idx && (state === "running" || state === "paused")) {
        const rem = state === "running" ? Math.max(0, endAt - now) : remainingMs;
        p = 100 * (1 - rem / (rounds[i] * 1000));
      }
      seg.style.setProperty("--p", `${p}%`);
    });
    const rest = rounds.slice(idx + 1).reduce((a, b) => a + b, 0) * 1000;
    if (state === "running") els.finishAt.textContent = `เสร็จราว ${clock(endAt + rest)}`;
    else if (state === "prep") els.finishAt.textContent = `เสร็จราว ${clock(endAt + rounds.reduce((a, b) => a + b, 0) * 1000)}`;
    else if (state === "finished") els.finishAt.textContent = "ครบแล้ว";
    else if (state === "paused") els.finishAt.textContent = "หยุดชั่วคราว";
    else els.finishAt.textContent = rounds.length ? "แตะรอบเพื่อแก้" : "";
  }

  // ---------- round editor ----------
  // Edits one round (index) or adds new ones (index null). Nothing changes
  // until Save, so Cancel always leaves the rounds as they were.
  const QUICK = [15, 20, 30, 40, 45, 60];
  let editing = null;
  let draft = 0;
  function openEditor(i) {
    if (!canEdit()) return;
    editing = i;
    draft = i === null ? (rounds[rounds.length - 1] || 30 * 60) : rounds[i];
    els.roundTitle.textContent = i === null ? "เพิ่มรอบ" : `รอบที่ ${i + 1}`;
    els.saveRound.textContent = i === null ? "เพิ่มรอบ" : "บันทึก";
    els.deleteRound.hidden = i === null;
    els.clearBtn.hidden = !rounds.length;
    els.roundInput.value = "";
    els.roundError.hidden = true;
    renderDraft();
    els.roundSheet.showModal();
  }
  function renderDraft() {
    els.draft.value = fmtRound(draft);
    els.stepDown.disabled = draft <= 5 * 60;
    els.quick.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.min * 60 === draft)));
  }
  function stepDraft(dir) {
    const five = 5 * 60;
    draft = dir > 0 ? Math.floor(draft / five) * five + five : Math.max(five, Math.ceil(draft / five) * five - five);
    renderDraft();
  }
  QUICK.forEach((m) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.min = m; b.textContent = m;
    b.setAttribute("aria-label", `${m} นาที`);
    b.onclick = () => { draft = m * 60; els.roundInput.value = ""; renderDraft(); };
    els.quick.appendChild(b);
  });
  els.stepDown.onclick = () => stepDraft(-1);
  els.stepUp.onclick = () => stepDraft(1);
  els.roundCancel.onclick = () => els.roundSheet.close();
  els.roundSheet.addEventListener("click", (e) => { if (e.target === els.roundSheet) els.roundSheet.close(); });
  els.roundForm.addEventListener("submit", (e) => {
    e.preventDefault();
    // Typed text wins over the stepper; it may hold several rounds ("30, 30").
    let vals = [draft];
    const parts = els.roundInput.value.split(/[,\s]+/).filter(Boolean);
    if (parts.length) {
      vals = parts.map(parseEntry);
      if (vals.some((v) => !Number.isFinite(v))) {
        els.roundError.textContent = "ใส่เป็นตัวเลขนาที เช่น 30 หรือ 30, 30 หรือ 1:30 (นาที:วินาที)";
        els.roundError.hidden = false;
        return;
      }
    }
    const at = editing;
    editRounds(() => (at === null ? rounds.push(...vals) : rounds.splice(at, 1, ...vals)));
    els.roundSheet.close();
  });
  els.deleteRound.onclick = () => {
    const at = editing;
    editRounds(() => rounds.splice(at, 1));
    els.roundSheet.close();
  };
  els.clearBtn.onclick = () => {
    editRounds(() => { rounds = []; });
    els.roundSheet.close();
  };

  function currentRemainingMs() {
    if (active()) return Math.max(0, endAt - Date.now());
    if (state === "paused") return remainingMs;
    if (state === "finished") return 0;
    return (rounds[0] || 0) * 1000;
  }

  function renderDial() {
    const rem = currentRemainingMs();
    const len = state === "prep" ? settings.prep : state === "idle" ? (rounds[0] || 0) : (rounds[idx] || 0);
    els.time.textContent = fmt(rem / 1000);
    const frac = len ? 1 - rem / (len * 1000) : 0;
    els.prog.style.strokeDashoffset = state === "finished" ? 0 : CIRC * (1 - frac);
    els.dial.classList.toggle("finished", state === "finished");
    els.dimTime.textContent = els.time.textContent;
    renderProgress();
    els.dimLabel.textContent = state === "prep" ? "เตรียมตัว" : `รอบ ${idx + 1} จาก ${rounds.length}`;

    if (state === "idle") els.roundLabel.textContent = rounds.length ? `พร้อมเริ่ม • ${rounds.length} รอบ` : "ยังไม่ได้ตั้งรอบ";
    else if (state === "finished") els.roundLabel.textContent = "ครบทุกรอบแล้ว";
    else if (state === "prep") els.roundLabel.textContent = "เตรียมตัว จัดท่านั่ง";
    else els.roundLabel.textContent = `รอบ ${idx + 1} จาก ${rounds.length}${state === "paused" ? " • หยุดชั่วคราว" : ""}`;

    if (state === "running") {
      els.endAt.textContent = idx < rounds.length - 1 ? `ครบรอบนี้ ${clock(endAt)}` : `ครบเวลา ${clock(endAt)}`;
    } else if (state === "prep") {
      els.endAt.textContent = `เริ่มรอบ 1 เมื่อนับถึง 0`;
    } else if (state === "finished") {
      els.endAt.textContent = "หยุดเองแล้ว ไม่ต้องกดอะไร";
    } else {
      els.endAt.textContent = "";
    }
  }

  function renderButtons() {
    document.body.classList.toggle("running", active() || state === "paused");
    els.startBtn.disabled = !rounds.length;
    els.startBtn.dataset.action = state === "running" ? "pause" : state === "paused" ? "resume" : "start";
    if (state === "prep") els.startBtn.dataset.action = "skip";
    els.startLabel.textContent = state === "running" ? "หยุดชั่วคราว" : state === "paused" ? "ทำต่อ"
      : state === "prep" ? "ข้าม เริ่มรอบแรกเลย" : state === "finished" ? "เริ่มใหม่" : "เริ่ม";
    els.resetBtn.disabled = state === "idle";
  }

  function renderAll() { renderList(); renderDial(); renderButtons(); renderWake(); renderDim(); }

  // ---------- dim screen ----------
  // While timing, a black screen shows only a faint clock. A tap brings the
  // controls back for a short while, then it dims again.
  const REVEAL_MS = 15000;
  let revealedUntil = 0;
  let dimTimer = null;
  function renderDim() {
    const show = settings.dim && active() && Date.now() >= revealedUntil;
    if (show) [els.roundSheet, els.settingsSheet].forEach((d) => d.open && d.close());
    els.dim.hidden = !show;
    document.body.classList.toggle("dimmed", show);
  }
  function reveal() {
    revealedUntil = Date.now() + REVEAL_MS;
    clearTimeout(dimTimer);
    dimTimer = setTimeout(renderDim, REVEAL_MS + 50);
    renderDim();
  }

  // ---------- engine ----------
  function tick() {
    if (state === "prep") {
      if (Date.now() >= endAt) beginRounds(endAt);
      else renderDial();
      return;
    }
    if (state !== "running") return;
    if (Date.now() >= endAt) {
      // Round finished: ring once, then move on (catch up if the page was asleep).
      let next = idx + 1;
      let nextEnd = endAt;
      while (next < rounds.length && nextEnd + rounds[next] * 1000 <= Date.now()) {
        nextEnd += rounds[next] * 1000;
        next++;
      }
      if (next >= rounds.length) {
        chime(finalKey());
        finish();
        return;
      }
      chime();
      idx = next;
      endAt = nextEnd + rounds[idx] * 1000;
      renderList();
    }
    renderDial();
  }

  function startLoop() { stopLoop(); timerId = setInterval(tick, 250); }
  function stopLoop() { if (timerId) clearInterval(timerId); timerId = null; }

  function start() {
    audio(); // unlock audio inside the tap
    revealedUntil = 0;
    if (state === "paused") {
      endAt = Date.now() + remainingMs;
      state = "running";
    } else if (settings.prep > 0) {
      idx = 0;
      endAt = Date.now() + settings.prep * 1000;
      state = "prep";
    } else {
      beginRounds(Date.now());
      return;
    }
    lockScreen();
    startLoop();
    renderAll();
  }
  // Round 1 starts at [at]: the end of the countdown, or now.
  function beginRounds(at) {
    idx = 0;
    endAt = at + rounds[0] * 1000;
    state = "running";
    lockScreen();
    startLoop();
    renderAll();
  }
  function pause() {
    remainingMs = Math.max(0, endAt - Date.now());
    state = "paused";
    stopLoop();
    unlockScreen();
    renderAll();
  }
  function finish() {
    state = "finished";
    revealedUntil = 0;
    stopLoop();
    unlockScreen();
    renderAll();
  }
  function reset() {
    state = "idle"; idx = 0; revealedUntil = 0; stopLoop(); unlockScreen(); renderAll();
  }

  // ---------- events ----------
  els.startBtn.onclick = () => {
    if (state === "running") pause();
    else if (state === "prep") beginRounds(Date.now());
    else start();
  };
  els.dim.onclick = reveal;
  els.settingsBtn.onclick = () => els.settingsSheet.showModal();
  els.settingsSheet.querySelector("[data-close]").onclick = () => els.settingsSheet.close();
  els.settingsSheet.addEventListener("click", (e) => { if (e.target === els.settingsSheet) els.settingsSheet.close(); }); // tap outside
  // Any tap while the controls are showing keeps them up a little longer.
  document.addEventListener("pointerdown", (e) => {
    if (active() && !els.dim.contains(e.target) && Date.now() < revealedUntil) reveal();
  });
  els.resetBtn.onclick = reset;
  els.wake.onclick = () => { if (wakeState === "denied") lockScreen(); };
  els.testSound.onclick = () => chime();

  // A row of one-choice buttons (radio group) that re-renders itself on pick.
  function choices(container, options, current, onPick, idPrefix) {
    container.innerHTML = "";
    options.forEach(([value, label, wide]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = wide ? "choice wide" : "choice"; b.id = `${idPrefix}-${value}`;
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", String(value === current()));
      b.textContent = label;
      b.onclick = () => { onPick(value); choices(container, options, current, onPick, idPrefix); };
      container.appendChild(b);
    });
  }
  const soundOptions = Object.entries(SOUNDS).map(([k, v]) => [k, v.label, v.wide]);
  choices(els.sounds, soundOptions, () => soundKey, (key) => {
    soundKey = key;
    try { localStorage.setItem(STORE_KEY + ":sound", key); } catch (_) {}
    chime(key);
  }, "sound");
  choices(els.finalSounds, [["same", "เหมือนรอบอื่น", true], ...soundOptions], () => settings.finalSound, (key) => {
    settings.finalSound = key;
    saveSettings();
    chime(finalKey());
  }, "final");
  choices(els.volumes, Object.entries(VOLUMES).map(([k, [label]]) => [k, label]), () => settings.volume, (k) => {
    settings.volume = k;
    saveSettings();
    chime();
  }, "volume");
  choices(els.preps, PREPS.map((n) => [n, n ? `${n} วิ` : "ไม่มี"]), () => settings.prep, (n) => {
    settings.prep = n;
    saveSettings();
  }, "prep");
  els.dimToggle.checked = settings.dim;
  els.dimToggle.onchange = () => { settings.dim = els.dimToggle.checked; saveSettings(); renderDim(); };
  renderAll();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
